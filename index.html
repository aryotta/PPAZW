<!DOCTYPE html>
<html>
    <head>
        <title>Todo App</title>
        <!-- Lets the page use the device's actual screen width on phones. -->
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- Loads Bootstrap so its ready-made layout and component classes work. -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <!-- bg-dark colors the desktop area around the phone screen. -->
    <body class="bg-dark">
        <!-- These Bootstrap classes make a full-height area and center its contents. -->
        <main class="container-fluid min-vh-100 d-flex align-items-center justify-content-center p-0">
            <!-- This is the phone-sized app screen. Change width/height to experiment. -->
            <div id="app" class="card shadow-sm rounded-0 overflow-auto" style="width: 375px; height: 100vh;">
                <!-- card-body adds spacing inside the screen; p-4 controls that padding. -->
                <div class="card-body p-4">
                    <h1 class="h2 mb-4">Co masz dzisiaj zrobić?</h1>
                    <div class="mb-3">
                        <label for="todoInputField" class="form-label">Dodaj zadanie</label>
                        <!-- The id connects this input to the JavaScript in public/main.js. -->
                        <input type="text" id="todoInputField" class="form-control" placeholder="Wpisz zadanie">
                    </div>
                    <!-- The button's id is used by JavaScript to listen for clicks. -->
                    <button type="button" id="todoAddButton" class="btn btn-primary w-100">Dodaj zadanie</button>
                    <!-- JavaScript adds the todo cards inside this empty container. -->
                    <div id="todoContainer" class="mt-4"></div>
                </div>
            </div>
        </main>

        <!-- Bootstrap's JavaScript bundle; included for Bootstrap components that need it. -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <!-- defer waits until HTML is parsed before running the app's JavaScript. -->
        <script src="public/main.js" defer></script>
    </body>
</html>
